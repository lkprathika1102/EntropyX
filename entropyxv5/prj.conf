# --- CORE SYSTEM & BUS CLOCKS ---
CONFIG_MCUX_COMPONENT_device.RTE=y
CONFIG_MCUX_COMPONENT_driver.clock=y
CONFIG_MCUX_COMPONENT_driver.port=y
CONFIG_MCUX_COMPONENT_driver.gpio=y
CONFIG_MCUX_COMPONENT_driver.common=y

# --- LPI2C PERIPHERAL ---
CONFIG_MCUX_COMPONENT_driver.lpflexcomm=y
CONFIG_MCUX_COMPONENT_driver.lpflexcomm_lpi2c=y

# --- HARDWARE CRYPTO ACCELERATION (EdgeLock Security / PSA) ---
CONFIG_MCUX_COMPONENT_component.els_pkc=y
CONFIG_MCUX_COMPONENT_component.els_pkc.platform.mcxn=y
CONFIG_MCUX_COMPONENT_component.els_pkc.psa_driver=y
CONFIG_MCUX_COMPONENT_component.els_pkc.hash=y
CONFIG_MCUX_COMPONENT_component.els_pkc.hashmodes=y

# --- CRYPTOGRAPHY ENGINE (Strictly mbedTLS 3.x) ---
CONFIG_MCUX_COMPONENT_middleware.mbedtls=n
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.crypto=y
CONFIG_MCUX_COMPONENT_middleware.mbedtls3x.port.hw_init=y
CONFIG_MCUX_COMPONENT_component.psa_crypto_driver.mbedtls_thread_alt=y

# --- EXCLUDE UNUSED PROTOCOL STACKS ---
CONFIG_MCUX_COMPONENT_middleware.freertos-kernel=n
CONFIG_MCUX_COMPONENT_middleware.iot_reference.logging=n
CONFIG_MCUX_COMPONENT_middleware.iot_reference.transport_mbedtls3x=n